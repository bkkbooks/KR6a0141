body:
  text: 宋天竺三藏求那跋陀羅譯聞如是一時婆伽婆在羅閲城耆闍崛山中與大比丘衆二百五十人俱爾時世尊告諸比丘當以十一想思念如來已思念當發慈心於如來所云何為十一戒意清淨一也威儀具足二也諸根不錯三也信意不亂四也常有勇健意五也若更苦樂不以為憂六也意不忘失七也止觀現在前八也三昧意無休息九也智慧意無量十也觀佛無厭足十一也如是比丘當以此十一想思念如來已思念如來當發慈心於如來所是謂比丘於比丘中修行念佛彼比丘已修行念佛於二果當求一果於現法中得自在成無餘阿那含爾時諸比丘聞佛所説歡喜奉行聞如是一時婆伽婆在舍衛城祇樹給孤獨園是時世尊告諸比丘若慈心解脫親近廣布修行以辦獲使起善具足便當有十一報十一果云何為十一臥安覺安不見惡夢天護人愛非人所敬不毒不兵水火不喪亦不加刑身壞命終生善處梵天上於諸善法速得捷疾智能盡有漏行比丘慈心解脫親近廣布修行以辦以獲便起善具足當有此十一法是故諸比丘當求方便慈心解脫如是諸比丘當作是學爾時諸比丘聞佛所説歡喜奉行
